<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>春节快乐！</title>
</head>
<body style="background:#fff;min-height:100vh;">
<h1 style="text-align:center;margin-top:200px;">灯笼测试页</h1>

<script>
(function() {
  'use strict';

  /* 春节公历日期表（2025-2050） */
  var SPRING_FESTIVALS = [
    '2025-01-29', '2026-02-17', '2027-02-06', '2028-01-26',
    '2029-02-13', '2030-02-03', '2031-01-23', '2032-02-11',
    '2033-01-31', '2034-02-19', '2035-02-08', '2036-01-28',
    '2037-02-15', '2038-02-04', '2039-01-24', '2040-02-12',
    '2041-02-01', '2042-01-22', '2043-02-10', '2044-01-30',
    '2045-02-17', '2046-02-06', '2047-01-26', '2048-02-14',
    '2049-02-02', '2050-01-23'
  ];

  /* 测试阶段：先放宽到 ±365 天，全年都能看到灯笼 */
  /* 正式上线改成 DAYS_BEFORE = 7, DAYS_AFTER = 15 */
  var DAYS_BEFORE = 365;
  var DAYS_AFTER  = 365;

  var TEXT_LEFT  = '新年';
  var TEXT_RIGHT = '快乐';

  function isSpringFestivalRange() {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    return SPRING_FESTIVALS.some(function(d) {
      var fest = new Date(d + 'T00:00:00');
      var diff = (today - fest) / 86400000;
      return diff >= -DAYS_BEFORE && diff <= DAYS_AFTER;
    });
  }

  if (!isSpringFestivalRange()) {
    console.log('不在春节区间，不渲染灯笼');
    return;
  }

  console.log('在春节区间，渲染灯笼');

  /* ---------- 注入样式 ---------- */
  var style = document.createElement('style');
  style.textContent = `
[class^=lantern],[class^=lantern]:before,[class^=lantern]:after{-webkit-box-sizing:border-box;box-sizing:border-box}
.lantern-left,.lantern-right{position:fixed;top:0;z-index:9999;pointer-events:none}
.lantern-left{left:150px}
.lantern-right{right:150px}
.lantern-container{width:150px;height:100px;position:relative;line-height:0;-webkit-animation:lantern 5s infinite ease-in-out;animation:lantern 5s infinite ease-in-out;-webkit-transform-origin:50% -100px;transform-origin:50% -100px}
.lantern-center{position:relative;height:100%;background-color:red;border-radius:120px;-webkit-box-shadow:0 0 80px -10px #f00;box-shadow:0 0 80px -10px red}
.lantern-line{height:100%;text-align:center}
.lantern-line:before,.lantern-line:after{content:"";position:absolute;top:0;left:50%;border:2px solid #ecaa2f;border-radius:50%;-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
.lantern-line:before{width:75%;height:100%}
.lantern-line:after{width:35%;height:100%}
.lantern-text-wrap{display:inline-block;vertical-align:top;height:100%}
.lantern-text{height:100%;display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;font-size:28px;font-weight:700;color:#ecaa2f;-webkit-writing-mode:vertical-lr;-ms-writing-mode:tb-lr;writing-mode:vertical-lr;text-align:center;letter-spacing:5px}
.lantern-top,.lantern-bottom{width:40%;height:8px;background-color:#ecaa2f;position:relative;z-index:1}
.lantern-top{margin:0 auto -2px;border-radius:5px 5px 0 0}
.lantern-bottom{margin:-2px auto 0;border-radius:0 0 5px 5px}
.lantern-top-rope,.lantern-bottom-rope{width:4px;background-color:#ecaa2f;margin:0 auto}
.lantern-top-rope{height:65px}
.lantern-bottom-rope{position:relative;height:20px;-webkit-animation:lantern 3s infinite ease-in-out;animation:lantern 3s infinite ease-in-out;-webkit-transform-origin:50% -45px;transform-origin:50% -45px}
.lantern-bottom-rope:after{content:"";position:absolute;top:100%;left:-4px;width:12px;height:50px;background:linear-gradient(#f00,#e36d00 3px,#fbd342 5px,#e36d00 8px,#e36d00 12px,#f00 16px,rgba(255,0,0,.8) 26px,rgba(255,0,0,.6));border-radius:5px 5px 0 0}
@-webkit-keyframes lantern{0%{-webkit-transform:rotate(-10deg);transform:rotate(-10deg)}50%{-webkit-transform:rotate(10deg);transform:rotate(10deg)}to{-webkit-transform:rotate(-10deg);transform:rotate(-10deg)}}
@keyframes lantern{0%{-webkit-transform:rotate(-10deg);transform:rotate(-10deg)}50%{-webkit-transform:rotate(10deg);transform:rotate(10deg)}to{-webkit-transform:rotate(-10deg);transform:rotate(-10deg)}}
@media screen and (max-width: 720px){.lantern-left{left:30px}.lantern-right{right:30px}.lantern-container{width:100px;height:60px}.lantern-top-rope{width:3px;height:45px}.lantern-center{-webkit-box-shadow:0 0 40px -10px #f00;box-shadow:0 0 40px -10px red}.lantern-top,.lantern-bottom{width:35%;height:6px}.lantern-top{margin-bottom:-.5px}.lantern-bottom{margin-top:-.5px}.lantern-bottom-rope{width:2px}.lantern-bottom-rope:after{left:-2px;width:6px;height:25px}.lantern-text{font-size:14px;letter-spacing:2px}}
@media screen and (max-width: 420px){.lantern-left{left:30px}.lantern-right{right:30px}.lantern-container{width:80px;height:50px}.lantern-top-rope{width:3px;height:42px}.lantern-center{-webkit-box-shadow:0 0 40px -10px #f00;box-shadow:0 0 40px -10px red}.lantern-top,.lantern-bottom{width:35%;height:4px}.lantern-top{margin-bottom:0}.lantern-bottom{margin-top:0}.lantern-bottom-rope{width:2px}.lantern-bottom-rope:after{left:-2px;width:6px;height:25px}.lantern-text{font-size:14px;letter-spacing:2px}.lantern-line:before,.lantern-line:after{border-width:1px}}
  `;
  document.head.appendChild(style);

  /* ---------- 注入 HTML ---------- */
  function buildLantern(side, text) {
    var sideClass = side === 'left' ? 'lantern-left' : 'lantern-right';
    return '<div class="' + sideClass + '"><div class="lantern-container">' +
      '<div class="lantern-top-rope"></div>' +
      '<div class="lantern-top"></div>' +
      '<div class="lantern-center">' +
        '<div class="lantern-line">' +
          '<div class="lantern-text-wrap">' +
            '<div class="lantern-text">' + text + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="lantern-bottom"></div>' +
      '<div class="lantern-bottom-rope"></div>' +
    '</div></div>';
  }

  var wrap = document.createElement('div');
  wrap.className = 'lantern';
  wrap.innerHTML = buildLantern('left', TEXT_LEFT) + buildLantern('right', TEXT_RIGHT);
  document.body.appendChild(wrap);
})();
</script>
</body>
</html>
